name: Set up build toolchain
description: JDK + Gradle caching, plus the Kotlin/Native toolchain cache on macOS runners.
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
    - uses: gradle/actions/setup-gradle@v4
    - if: runner.os == 'macOS'
      uses: actions/cache@v4
      with:
        path: ~/.konan
        key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
        restore-keys: konan-${{ runner.os }}-
