name: CI

# Tests and builds every app on pull requests and on main. On main, the web job's build is also
# deployed to GitHub Pages: the landing page (/), the organiser web app (/organise/) and the static
# pages in app/webApp/public (e.g. the privacy policies). Releases are built by release.yml.
# Changes to docs and store listings alone run nothing.
on:
  pull_request:
    paths-ignore: &docs
      - 'docs/**'
      - '*.md'
      - 'fastlane/**'
  push:
    branches: [main]
    paths-ignore: *docs

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main halfway through a Pages deploy
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  android:
    name: Android + Wear OS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
      - run: >
          ./gradlew
          :app:sharedUI:testAndroidHostTest
          :app:sharedLogic:testAndroidHostTest
          :app:androidApp:testDebugUnitTest
          :app:wearApp:testDebugUnitTest
          :app:androidApp:assembleDebug
          :app:wearApp:assembleDebug
          :app:androidApp:lintDebug
          :app:wearApp:lintDebug
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: app/*/build/reports/tests/

  apple:
    name: iOS + watchOS
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
      - run: ./gradlew :app:sharedLogic:iosSimulatorArm64Test :app:sharedLogic:watchosSimulatorArm64Test
      - name: Build iOS app (simulator, unsigned)
        run: >
          xcodebuild build
          -project app/iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          ARCHS=arm64
          CODE_SIGNING_ALLOWED=NO

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: ./gradlew :app:sharedLogic:jsTest
      # The landing page's phone and watch screens, captured fresh with Robolectric
      - name: Capture the landing page screens
        run: ./gradlew :app:androidApp:testDebugUnitTest :app:wearApp:testDebugUnitTest --tests '*.SiteScreenshotTest' -PsiteScreenshots
      - run: npm run build:shared
      - run: npm install
      - run: npm run build -w webApp
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - run: npm test -w webApp
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/webApp/dist

  pages:
    name: Deploy Pages
    needs: web
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
