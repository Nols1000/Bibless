name: GitHub Pages

# Deploys the web app together with the static pages in app/webApp/public (e.g. the privacy
# policies at /privacy/android/ and /privacy/apple/) from main.
on:
  push:
    branches: [main]
    paths:
      - 'app/webApp/**'
      - 'app/sharedLogic/**'
      - 'core/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build:shared
      - run: npm install
      - run: npm run build -w webApp
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/webApp/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
