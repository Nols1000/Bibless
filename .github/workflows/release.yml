name: Release

# Builds the release bundles for a vX.Y.Z tag, uploads them with their store listings (texts plus
# screenshots captured on the runner) to Play closed testing and TestFlight, then creates the
# GitHub Release. A failed job can be re-run on its own: a bundle Play already has is skipped.
on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      name: ${{ steps.version.outputs.name }}
      code_phone: ${{ steps.version.outputs.code_phone }}
      code_wear: ${{ steps.version.outputs.code_wear }}
    steps:
      - id: version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not of the form vX.Y.Z"; exit 1
          fi
          base=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 10000 + BASH_REMATCH[3] * 100 ))
          # Phone and Wear OS share an applicationId, so each bundle needs its own versionCode
          {
            echo "name=${GITHUB_REF_NAME#v}"
            echo "code_phone=$base"
            echo "code_wear=$(( base + 1 ))"
          } >> "$GITHUB_OUTPUT"

  android:
    name: Android + Wear OS
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Workload Identity Federation for Google Play
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build release bundles
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks" ./gradlew \
            :app:androidApp:bundleRelease :app:wearApp:bundleRelease \
            -PappVersionName=${{ needs.version.outputs.name }} \
            -PappVersionCode=${{ needs.version.outputs.code_phone }} \
            -PwearVersionCode=${{ needs.version.outputs.code_wear }}
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            app/androidApp/build/outputs/bundle/release/*.aab
            app/wearApp/build/outputs/bundle/release/*.aab
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
      - name: Upload to Play closed testing with the listing
        run: >
          bundle exec fastlane android release
          version_code_phone:${{ needs.version.outputs.code_phone }}
          version_code_wear:${{ needs.version.outputs.code_wear }}

  ios:
    name: iOS + watchOS
    needs: version
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Set up access to the match certificates repo
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$MATCH_DEPLOY_KEY" > ~/.ssh/match_deploy_key
          chmod 600 ~/.ssh/match_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/match_deploy_key -o IdentitiesOnly=yes" >> "$GITHUB_ENV"
      - name: Upload to TestFlight with the listing
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: >
          bundle exec fastlane ios release
          version:${{ needs.version.outputs.name }}
          build_number:${{ github.run_number }}
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: build/ios/*.ipa

  github-release:
    name: GitHub Release
    needs: [android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s globstar
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            dist/**/*.aab dist/**/*.ipa
