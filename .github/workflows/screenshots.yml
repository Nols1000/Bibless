name: Screenshots

# Captures the store screenshots with the UI tests (fastlane screengrab / snapshot, demo data) and
# keeps them as artifacts of the run; store-metadata.yml uploads them. Each device runs in its own
# job, so the captures take as long as the slowest one. The Release workflow starts this while it
# builds. Changes to the screenshot tests run it on main, so a broken test shows up before a release.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fastlane/Fastfile'
      - 'fastlane/screenshots/captions.json'
      - 'tools/screenshots/**'
      - 'app/iosApp/*UITests*/**'
      - 'app/*/src/androidTest/**'
      - '.github/workflows/screenshots.yml'

jobs:
  play:
    name: Play ${{ matrix.name }} screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: phone
            api-level: 35
            target: google_apis
            profile: pixel_7
            disk-size: ''
          - name: wear
            api-level: 33
            target: android-wear
            profile: wearos_large_round
            # The Wear OS image defaults to a 7 GB userdata partition
            disk-size: 2048M
          # A separate device type of the same Play slot; its files add to the round watch's
          - name: wear_square
            api-level: 33
            target: android-wear
            profile: wearos_square
            disk-size: 2048M
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      # The Gradle build plus the emulator image overflow the runner's disk otherwise
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL"
      # Pillow draws the headlines on the phone screenshots (tools/screenshots/frame.py)
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/screenshots/requirements.txt
      - run: pip install -r tools/screenshots/requirements.txt
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # A booted emulator snapshot, so the capture skips the cold boot. Saved right after it's
      # created rather than at the end of the job, where the disk would hold that run's app: signed
      # with the runner's own debug key, it blocks every later install.
      - name: Restore the emulator
        id: avd-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-v2-${{ matrix.api-level }}-${{ matrix.target }}-${{ matrix.profile }}-${{ matrix.disk-size }}
      - name: Create the emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          disk-size: ${{ matrix.disk-size }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Created the emulator snapshot"
      - name: Save the emulator
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd-cache.outputs.cache-primary-key }}
      - name: Capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          disk-size: ${{ matrix.disk-size }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bundle exec fastlane android screenshots ${{ matrix.name }}:emulator-5554
      - uses: actions/upload-artifact@v7
        with:
          name: play-screenshots-${{ matrix.name }}
          path: fastlane/metadata/android/*/images/*Screenshots/
          if-no-files-found: error

  app-store:
    name: App Store screenshots
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The Xcode build compiles the shared Kotlin framework through Gradle
      - uses: ./.github/actions/setup-build
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      # Pillow draws the headlines on the phone screenshots (tools/screenshots/frame.py)
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/screenshots/requirements.txt
      - run: pip install -r tools/screenshots/requirements.txt
      - name: iPhone and Apple Watch screenshots
        run: bundle exec fastlane ios screenshots
      - uses: actions/upload-artifact@v7
        with:
          name: app-store-screenshots
          path: fastlane/screenshots/ios/
          if-no-files-found: error
