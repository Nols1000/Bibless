name: Screenshots

# Captures the store screenshots with the UI tests (Roborazzi / fastlane snapshot, demo data) and
# keeps them as artifacts of the run; store-metadata.yml uploads them. The Play ones render with
# Robolectric in one job, the App Store ones on simulators in another. The Release workflow starts
# this while it builds. Changes to the screenshot tests run it on main, so a broken test shows up
# before a release.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fastlane/Fastfile'
      - 'fastlane/screenshots/captions.json'
      - 'tools/screenshots/**'
      - 'app/iosApp/*UITests*/**'
      - 'app/*/src/test/**'
      - '.github/workflows/screenshots.yml'

jobs:
  # Robolectric renders the phone and both watches on the JVM, so one plain job takes them all
  play:
    name: Play screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      # Pillow draws the headlines on the phone screenshots (tools/screenshots/frame.py)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pillow
      - name: Capture
        run: bundle exec fastlane android screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: play-screenshots
          path: fastlane/metadata/android/*/images/*Screenshots/
          if-no-files-found: error

  app-store:
    name: App Store screenshots
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # The Xcode build compiles the shared Kotlin framework through Gradle
      - uses: ./.github/actions/setup-build
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      # Pillow draws the headlines on the phone screenshots (tools/screenshots/frame.py)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pillow
      - name: iPhone and Apple Watch screenshots
        run: bundle exec fastlane ios screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: fastlane/screenshots/ios/
          if-no-files-found: error
