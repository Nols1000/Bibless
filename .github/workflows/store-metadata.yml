name: Store metadata

# Syncs store listings to Google Play and App Store Connect: texts from fastlane/metadata, plus the
# screenshots from screenshots.yml. The Release workflow captures the screenshots while it builds
# (or finds them from a Screenshots run for the same commit) and calls this with capture: false once
# the builds are uploaded, so the listing changes together with the app it describes. Run it by hand for listing-only fixes; it then captures them itself.
on:
  workflow_call:
    inputs:
      capture:
        description: Capture the screenshots first (false if this run already did)
        type: boolean
        default: true
      screenshots_run_id:
        description: Run whose screenshot artifacts to use (defaults to this run)
        type: string
        default: ''
  workflow_dispatch:

jobs:
  screenshots:
    name: Screenshots
    # Called with capture: false, or run by hand (no inputs, so capture is unset but wanted)
    if: inputs.capture != false
    uses: ./.github/workflows/screenshots.yml

  play:
    name: Google Play listing
    needs: screenshots
    if: ${{ !failure() && !cancelled() && vars.PLAY_SERVICE_ACCOUNT != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: store-metadata-play
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read # screenshots from another run
      id-token: write # Workload Identity Federation for Google Play
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/download-artifact@v4
        with:
          pattern: play-screenshots-*
          path: fastlane/metadata/android
          merge-multiple: true
          run-id: ${{ inputs.screenshots_run_id || github.run_id }}
          # Only another run needs the API; this run's artifacts download without it
          github-token: ${{ inputs.screenshots_run_id && github.token || '' }}
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
      - run: bundle exec fastlane android metadata

  app-store:
    name: App Store listing
    needs: screenshots
    if: ${{ !failure() && !cancelled() }}
    runs-on: macos-26
    timeout-minutes: 15
    concurrency:
      group: store-metadata-app-store
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read # screenshots from another run
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
    steps:
      - if: env.ASC_KEY_ID == ''
        run: echo "::notice::ASC_KEY_ID not set, skipping App Store listing sync"
      - uses: actions/checkout@v4
        if: env.ASC_KEY_ID != ''
      - uses: ruby/setup-ruby@v1
        if: env.ASC_KEY_ID != ''
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/download-artifact@v4
        if: env.ASC_KEY_ID != ''
        with:
          name: app-store-screenshots
          path: fastlane/screenshots/ios
          run-id: ${{ inputs.screenshots_run_id || github.run_id }}
          # Only another run needs the API; this run's artifacts download without it
          github-token: ${{ inputs.screenshots_run_id && github.token || '' }}
      - if: env.ASC_KEY_ID != ''
        run: bundle exec fastlane ios metadata
